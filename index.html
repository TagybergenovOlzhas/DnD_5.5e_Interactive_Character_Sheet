<!DOCTYPE html>
<html lang="ru">
  <head>

    <title>D&amp;D 5.5e (2024) — Журнал Персонажа</title>

        if (localStorage.getItem('dnd-sheet-night') === '1') {
          document.documentElement.classList.add('night');
        }
      } catch (e) {}

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />

  <body class="bg-[var(--paper)] text-[var(--ink)] font-sans antialiased selection:bg-[color-mix(in_srgb,var(--ochre)_25%,transparent)] selection:text-[var(--ink)]">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
